name: Bug report
description: Report a fixture-only validation bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This project is a research-only market evidence validation pipeline, not a trading bot.
        Do not include secrets, credentials, account data, or private exchange output.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What validation behavior is incorrect?
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Synthetic fixture or minimal example
      description: Provide a small non-private example.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This issue does not request order execution, private exchange API access, financial advice, or live/shadow runtime.
          required: true

